<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Veloura Vault - Cart</title>
    <style>
      :root {
        --bg: #fff9f3;
        --bg-2: #f3eefe;
        --card: rgba(255,255,255,0.9);
        --text: #1d1b2a;
        --muted: #625d74;
        --accent: #8a5cf6;
        --accent-2: #ff7a59;
        --success: #1cc8a1;
        --border: rgba(138, 92, 246, 0.1);
        --shadow: 0 25px 60px rgba(84, 58, 131, 0.14);
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, var(--bg) 0%, var(--bg-2) 100%);
        color: var(--text);
      }

      .container {
        max-width: 980px;
        margin: 0 auto;
        padding: 36px 20px 80px;
      }

      .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 30px;
        box-shadow: var(--shadow);
        overflow: hidden;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 18px 24px;
        border-bottom: 1px solid var(--border);
        background: rgba(255,255,255,0.4);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        font-weight: 800;
        letter-spacing: 0.04em;
      }

      .mark {
        width: 42px;
        height: 42px;
        display: grid;
        place-items: center;
        border-radius: 14px;
        background: linear-gradient(135deg, var(--accent), var(--accent-2));
        color: white;
      }

      .content {
        display: grid;
        grid-template-columns: 1.1fr 0.9fr;
        gap: 26px;
        padding: 28px;
      }

      .cart-box {
        display: flex;
        align-items: center;
        gap: 22px;
        padding: 18px;
        border: 1px solid var(--border);
        border-radius: 26px;
        background: linear-gradient(135deg, rgba(138, 92, 246, 0.06), rgba(255, 122, 89, 0.04));
      }

      .cart-icon {
        width: 90px;
        height: 90px;
        display: grid;
        place-items: center;
        border-radius: 26px;
        background: linear-gradient(135deg, var(--accent), var(--accent-2));
        font-size: 2.8rem;
        box-shadow: 0 18px 35px rgba(138, 92, 246, 0.28);
      }

      .title {
        margin: 0;
        font-size: clamp(2rem, 4vw, 3rem);
      }

      .subtitle {
        margin: 8px 0 0;
        color: var(--muted);
        line-height: 1.6;
      }

      .product-panel {
        display: flex;
        gap: 18px;
        align-items: center;
        padding: 16px;
        background: rgba(255,255,255,0.8);
        border: 1px solid var(--border);
        border-radius: 20px;
        margin-top: 24px;
      }

      .product-panel img {
        width: 148px;
        height: 148px;
        object-fit: cover;
        border-radius: 18px;
      }

      .product-info h3 {
        margin: 0 0 6px;
        font-size: 1.45rem;
      }

      .product-info p {
        margin: 0 0 10px;
        color: var(--muted);
      }

      .price-tag {
        display: inline-block;
        padding: 8px 12px;
        background: rgba(28, 200, 161, 0.12);
        color: #0d876d;
        border-radius: 999px;
        font-weight: 800;
      }

      .summary {
        padding: 20px;
        border-radius: 24px;
        background: linear-gradient(180deg, rgba(255,255,255,0.82), rgba(243,238,254,0.66));
        border: 1px solid var(--border);
      }

      .summary h4 {
        margin: 0 0 18px;
        font-size: 1.3rem;
      }

      .summary-row {
        display: flex;
        justify-content: space-between;
        margin: 10px 0;
        color: var(--muted);
      }

      .summary-row strong {
        color: var(--text);
      }

      .divider {
        height: 1px;
        background: rgba(29,27,42,0.1);
        margin: 18px 0;
      }

      .summary-total {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 1.2rem;
        font-weight: 800;
      }

      .cta {
        width: 100%;
        margin-top: 24px;
        border: none;
        border-radius: 16px;
        padding: 16px 18px;
        font-size: 1rem;
        font-weight: 800;
        color: white;
        background: linear-gradient(135deg, var(--accent), var(--accent-2));
        box-shadow: 0 18px 30px rgba(138, 92, 246, 0.3);
        cursor: pointer;
      }

      .secondary {
        width: 100%;
        margin-top: 12px;
        border: 1px solid rgba(29,27,42,0.1);
        background: rgba(255,255,255,0.8);
        color: var(--text);
        border-radius: 16px;
        padding: 14px 18px;
        font-weight: 700;
        cursor: pointer;
      }

      @media (max-width: 760px) {
        .content { grid-template-columns: 1fr; }
        .product-panel { flex-direction: column; align-items: flex-start; }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="card">
        <div class="topbar">
          <div class="brand">
            <div class="mark">V</div>
            <span>Veloura Vault</span>
          </div>
          <div style="font-weight:700; color: var(--muted);">Your cart</div>
        </div>

        <div class="content">
          <div>
            <div class="cart-box">
              <div class="cart-icon">🛒</div>
              <div>
                <h1 class="title">Added to cart</h1>
                <p class="subtitle">Your selected piece is waiting for you. Review it and continue to checkout.</p>
              </div>
            </div>

            <div id="productPanel" class="product-panel" style="display:none;">
              <img id="productImage" src="" alt="Selected product" />
              <div class="product-info">
                <h3 id="productName">Product Name</h3>
                <p id="productMeta">Category • Size</p>
                <span id="productPrice" class="price-tag">$0.00</span>
              </div>
            </div>
          </div>

          <aside class="summary">
            <h4>Order summary</h4>
            <div class="summary-row"><span>Item</span><strong id="itemLabel">1 product</strong></div>
            <div class="summary-row"><span>Shipping</span><strong>Free</strong></div>
            <div class="summary-row"><span>Tax</span><strong>$0.00</strong></div>
            <div class="divider"></div>
            <div class="summary-total"><span>Total</span><span id="totalPrice">$0.00</span></div>
            <button class="cta" onclick="window.location.href='payment.html'">Proceed to payment</button>
            <button class="secondary" onclick="window.location.href='catalog.html'">Continue shopping</button>
          </aside>
        </div>
      </div>
    </div>

    <script>
      function readProduct() {
        const params = new URLSearchParams(window.location.search);
        const item = params.get('item');
        const fallback = JSON.parse(localStorage.getItem('velouraCart') || '[]').pop() || null;
        const product = item ? JSON.parse(decodeURIComponent(item)) : fallback;

        if (!product) {
          document.getElementById('productPanel').style.display = 'none';
          return;
        }

        const panel = document.getElementById('productPanel');
        const img = document.getElementById('productImage');
        const name = document.getElementById('productName');
        const meta = document.getElementById('productMeta');
        const price = document.getElementById('productPrice');

        panel.style.display = 'flex';
        const imageUrl = product.image || product.imageUrl || 'https://placehold.co/600x400/0f172a/ffffff?text=Veloura';
        img.src = imageUrl;
        name.textContent = product.name || 'Premium Product';
        meta.textContent = `${product.category || 'General'} • ${product.sizes || 'One Size'}`;
        const priceValue = Number(product.price || 0);
        price.textContent = `$${priceValue.toFixed(2)}`;

        document.getElementById('itemLabel').textContent = '1 product';
        document.getElementById('totalPrice').textContent = `$${priceValue.toFixed(2)}`;
      }

      readProduct();
    </script>
  </body>
</html>
