version: "3.9"

# Docker Compose file for running the full ecommerce application stack locally
# This file starts the database, cache, and the Spring Boot app together.
# This is mainly useful for local development and testing.

services:
  # MySQL database service used by the Spring Boot application
  mysql:
    image: mysql:8.0
    container_name: ecommerce-mysql
    restart: unless-stopped
    environment:
      # Database name used by the app
      MYSQL_DATABASE: ecommerce
      # Application user credentials
      MYSQL_USER: admin
      MYSQL_PASSWORD: password
      # Root credentials for database management inside the container
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      # Expose MySQL on localhost so tools or apps can connect from outside the container
      - "3306:3306"
    volumes:
      # Persist MySQL data across container restarts
      - mysql_data:/var/lib/mysql
    healthcheck:
      # Check if MySQL is ready before app starts depending on it
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # Redis service used for caching
  redis:
    image: redis:7-alpine
    container_name: ecommerce-redis
    restart: unless-stopped
    ports:
      # Expose Redis locally for debugging or manual access
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      # Keep Redis data persistent
      - redis_data:/data

  # Spring Boot application service
  app:
    build:
      # Build using the Dockerfile in the current project folder
      context: .
      dockerfile: Dockerfile
    container_name: ecommerce-app
    depends_on:
      # Start MySQL only after it passes the healthcheck
      mysql:
        condition: service_healthy
      # Start Redis after MySQL is ready
      redis:
        condition: service_started
    restart: unless-stopped
    environment:
      # These values match the Spring app configuration in application.yml
      # DB_HOST is set to the Docker service name 'mysql', not localhost
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ecommerce
      DB_USERNAME: admin
      DB_PASSWORD: password
      REDIS_HOST: redis
      REDIS_PORT: 6379
      S3_BUCKET: ${S3_BUCKET:-ecommerce-product-images-426163621897}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-${AWS_REGION:-us-east-1}}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_SDK_LOAD_CONFIG: "1"
    volumes:
      # Mount the host AWS CLI config so the app can read the same credentials
      # you already configured in your local terminal.
      - ${HOME}/.aws:/root/.aws:ro
    ports:
      # Map container port 8080 to host port 8080
      - "8080:8080"

# Named volumes to keep database and cache data persistent outside the containers
volumes:
  mysql_data:
  redis_data:
