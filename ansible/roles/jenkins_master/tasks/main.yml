---
- name: Add Jenkins repository on Debian-based hosts
  apt_key:
    url: https://pkg.jenkins.io/debian-stable/jenkins.io-2023.key
    state: present
  when: ansible_os_family == "Debian"

- name: Add Jenkins repository on Debian-based hosts
  apt_repository:
    repo: 'deb https://pkg.jenkins.io/debian-stable binary/'
    state: present
    filename: jenkins
  when: ansible_os_family == "Debian"

- name: Add Jenkins repository on RedHat-based hosts
  yum_repository:
    name: jenkins
    description: Jenkins stable repo
    baseurl: https://pkg.jenkins.io/redhat-stable
    gpgcheck: true
    gpgkey: https://pkg.jenkins.io/redhat-stable/jenkins.io-2023.key
    enabled: true
  when: ansible_os_family == "RedHat"

- name: Install Jenkins on Debian-based hosts
  apt:
    name: jenkins
    state: present
    update_cache: true
  when: ansible_os_family == "Debian"

- name: Install Jenkins on RedHat-based hosts
  yum:
    name: jenkins
    state: present
  when: ansible_os_family == "RedHat"

- name: Ensure Jenkins service is enabled and started
  systemd:
    name: jenkins
    enabled: true
    state: started

- name: Open Jenkins UI port 8080 when firewalld is present
  shell: |
    if command -v firewall-cmd >/dev/null 2>&1; then
      firewall-cmd --permanent --add-port=8080/tcp >/dev/null 2>&1 || true
      firewall-cmd --permanent --add-port=50000/tcp >/dev/null 2>&1 || true
      firewall-cmd --reload >/dev/null 2>&1 || true
    fi
  changed_when: false

- name: Wait for Jenkins to come up
  wait_for:
    port: 8080
    timeout: 180
