---
- name: Upgrade existing packages
  yum:
    name: "*"
    state: latest

- name: Install base dependencies
  yum:
    name:
      - git
      - curl
      - wget
      - unzip
      - tar
      - jq
      - net-tools
      - python3
      - python3-pip
      - docker
      - firewalld
      - java-17-amazon-corretto-devel
    state: present

- name: Start and enable Docker
  systemd:
    name: docker
    enabled: true
    state: started

- name: Start and enable firewalld
  systemd:
    name: firewalld
    enabled: true
    state: started
