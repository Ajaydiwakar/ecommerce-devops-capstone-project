---
- name: Repair apt state before upgrading on Debian-based hosts
  shell: |
    dpkg --configure -a || true
    apt-get -f install -y || true
  args:
    executable: /bin/bash
  when: ansible_os_family == "Debian"
  changed_when: false

- name: Upgrade existing packages on Debian-based hosts
  apt:
    upgrade: safe
    update_cache: true
  when: ansible_os_family == "Debian"

- name: Upgrade existing packages on RedHat-based hosts
  yum:
    name: "*"
    state: latest
  when: ansible_os_family == "RedHat"

- name: Install base dependencies on Debian-based hosts
  apt:
    name:
      - git
      - curl
      - wget
      - unzip
      - tar
      - jq
      - net-tools
      - python3
      - python3-pip
      - docker.io
      - firewalld
      - openjdk-17-jdk
    state: present
    update_cache: true
  when: ansible_os_family == "Debian"

- name: Install base dependencies on RedHat-based hosts
  yum:
    name:
      - git
      - curl
      - wget
      - unzip
      - tar
      - jq
      - net-tools
      - python3
      - python3-pip
      - docker
      - firewalld
      - java-17-amazon-corretto-devel
    state: present
  when: ansible_os_family == "RedHat"

- name: Start and enable Docker
  systemd:
    name: docker
    enabled: true
    state: started

- name: Start and enable firewalld
  systemd:
    name: firewalld
    enabled: true
    state: started
