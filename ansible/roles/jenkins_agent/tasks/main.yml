---
- name: Install Java 17 and SSH tooling on Debian-based hosts
  apt:
    name:
      - openjdk-17-jdk
      - openssh-server
      - git
      - curl
      - wget
    state: present
    update_cache: true
  when: ansible_os_family == "Debian"

- name: Install Java 17 and SSH tooling on RedHat-based hosts
  yum:
    name:
      - java-17-amazon-corretto-devel
      - openssh-server
      - git
      - curl
      - wget
    state: present
  when: ansible_os_family == "RedHat"

- name: Create Jenkins user if missing
  user:
    name: jenkins
    shell: /bin/bash
    create_home: true
    groups: wheel
    append: true

- name: Ensure sshd is enabled and running
  systemd:
    name: sshd
    enabled: true
    state: started

- name: Allow SSH access when firewalld is present
  shell: |
    if command -v firewall-cmd >/dev/null 2>&1; then
      firewall-cmd --permanent --add-port=22/tcp >/dev/null 2>&1 || true
      firewall-cmd --reload >/dev/null 2>&1 || true
    fi
  changed_when: false
