<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Veloura Vault - Payment</title>
    <style>
      :root {
        --bg: #fffaf6;
        --bg-2: #f3f3ff;
        --card: rgba(255,255,255,0.9);
        --text: #1d1b2a;
        --muted: #625d74;
        --accent: #8a5cf6;
        --accent-2: #ff7a59;
        --border: rgba(138, 92, 246, 0.12);
        --shadow: 0 25px 60px rgba(84, 58, 131, 0.15);
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, var(--bg), var(--bg-2));
        color: var(--text);
      }

      .wrap {
        width: min(900px, calc(100% - 32px));
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 30px;
        box-shadow: var(--shadow);
        padding: 30px 24px;
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        font-size: 1.1rem;
        font-weight: 800;
        letter-spacing: 0.04em;
        color: var(--text);
        margin-bottom: 20px;
      }

      .mark {
        width: 42px;
        height: 42px;
        display: grid;
        place-items: center;
        border-radius: 14px;
        background: linear-gradient(135deg, var(--accent), var(--accent-2));
        color: white;
      }

      .message-box {
        text-align: center;
        padding: 24px 18px 10px;
      }

      .bear {
        font-size: 5rem;
        margin-bottom: 10px;
        animation: bounce 1.8s ease-in-out infinite;
      }

      @keyframes bounce {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-8px); }
      }

      h1 {
        margin: 0;
        font-size: clamp(2rem, 5vw, 3.4rem);
        line-height: 1.2;
      }

      .note {
        margin: 18px auto 0;
        max-width: 650px;
        font-size: 1.08rem;
        color: var(--muted);
        line-height: 1.7;
      }

      .cta-row {
        display: flex;
        justify-content: center;
        gap: 12px;
        flex-wrap: wrap;
        margin-top: 28px;
      }

      .btn {
        border: none;
        border-radius: 15px;
        padding: 15px 20px;
        font-weight: 800;
        font-size: 0.98rem;
        cursor: pointer;
      }

      .primary {
        background: linear-gradient(135deg, var(--accent), var(--accent-2));
        color: white;
        box-shadow: 0 16px 32px rgba(138, 92, 246, 0.28);
      }

      .secondary {
        background: rgba(255,255,255,0.8);
        color: var(--text);
        border: 1px solid rgba(29,27,42,0.1);
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="brand">
        <div class="mark">V</div>
        <span>Veloura Vault</span>
      </div>

      <div class="message-box">
        <div class="bear">🧸</div>
        <h1>Hey Dear, you can buy me a Bear.</h1>
        <p class="note">
          Don’t get feared — your interview will be cleared. Keep smiling, stay confident, and let this bear be your lucky charm.
        </p>

        <div class="cta-row">
          <button class="btn primary" onclick="window.location.href='catalog.html'">Back to collection</button>
          <button class="btn secondary" onclick="alert('Lucky bear activated! Your confidence level is now 100%.')">Unlock luck</button>
        </div>
      </div>
    </div>
  </body>
</html>
